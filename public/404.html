<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pagina non trovata — MDIO Lombardo</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  :root { --bg: #faf2e7; --ink: #3b1d26; --accent: #a3002c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
    text-align: center;
  }
  main { max-width: 480px; }
  img { width: 160px; height: 160px; border-radius: 50%; background: #fff; object-fit: cover; }
  .code { color: var(--accent); font-size: 0.9rem; font-weight: 700; letter-spacing: 0.2em; margin: 16px 0 4px; }
  h1 { font-size: clamp(1.6rem, 6vw, 2.2rem); margin: 0 0 12px; line-height: 1.2; }
  p { margin: 0 0 24px; line-height: 1.5; }
  a.btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 999px;
  }
  a.btn:hover, a.btn:focus-visible { background: #7d0022; outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/assets/logo-mdio.jpeg" alt="Logo MDIO — Lombardia e Provincia di Piacenza" width="160" height="160" />
  <p class="code">ERRORE 404</p>
  <h1>Questa pagina non esiste</h1>
  <p>Il link potrebbe essere vecchio o contenere un errore. Torna alla home per ritrovare i distretti 2041, 2042 e 2050.</p>
  <a class="btn" href="/">Torna alla home</a>
</main>
</body>
</html>
