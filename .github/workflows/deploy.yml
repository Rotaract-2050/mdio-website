name: Deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]
  schedule:
    - cron: '0 * * * *'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download del codice sorgente
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installazione delle dipendenze
        run: npm ci

      - name: Aggiornamento contenuti da WordPress
        run: node scripts/fetch-content.mjs
        env:
          WP_CONTENT_URL: https://multidistrettolombardo.org/cms/wp-json/mdio/v1/content

      - name: Compilazione del progetto con Vite
        run: npm run build

      - name: Caricamento via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /domains/multidistrettolombardo.org/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
